<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background: Deep green circle to ensure contrast at small sizes -->
  <rect width="64" height="64" rx="14" fill="#1B3D34"/>
  <!-- House body (white fill) -->
  <path d="M12 56V32L32 14L52 32V56H12Z" fill="white" opacity="0.15"/>
  <!-- House outline -->
  <path d="M12 56V32L32 14L52 32V56H12Z" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Orange roof ridge / peak accent matching official logo -->
  <path d="M20 24L32 14L44 24" stroke="#F28C28" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door -->
  <path d="M25 56V44H39V56" stroke="white" stroke-width="3" stroke-linejoin="round"/>
</svg>
