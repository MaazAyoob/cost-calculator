<!DOCTYPE html>

    <meta name="theme-color" content="#2563EB" />
    <!-- Theme init: prevents flash of wrong theme -->
    <script>
      (function(){
        try {
          var t = localStorage.getItem('cc-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.classList.add(t);
        } catch(e) {}
      })();
    </script>
    <link rel="canonical" href="https://costcalculator.app/" />

    <!-- Primary Meta Tags -->
    <title>Cost Calculator by Rightcon | Home Construction Planning & Estimation</title>

    <meta name="author" content="Rightcon Constructions / Cost Calculator" />
